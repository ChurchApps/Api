name: Deploy Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  SERVERLESS_ACCESS_KEY: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Demo
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "yarn"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run linting and type check
        run: |
          yarn lint:check
          yarn tsc

      - name: Build application
        run: yarn build

      - name: Prepare Lambda Layer
        run: yarn build-layer

      - name: Deploy Core APIs to Demo
        run: yarn serverless deploy --stage demo --verbose

      - name: Verify deployment
        run: |
          echo "Deployment completed for Demo environment"
          yarn serverless info --stage demo
          for fn in web socket timer15Min timerMidnight timerScheduledTasks timerWebhooks migrate sesFeedback; do
            runtime=$(aws lambda get-function-configuration --function-name "api-demo-$fn" --query Runtime --output text)
            echo "api-demo-$fn runtime: $runtime"
            test "$runtime" = "nodejs24.x"
          done
          body=$(curl -fsS https://api.demo.churchapps.org/health)
          echo "$body"
          echo "$body" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!String(j.node||"").startsWith("v24.")){console.error("expected Node 24, got", j.node); process.exit(1)}'
